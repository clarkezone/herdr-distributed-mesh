name: Mesh CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject literal Tailscale credentials
        shell: bash
        run: |
          if git grep -I -q -E 'tskey-(api|auth|client)-[A-Za-z0-9_-]{4,}' -- .; then
            echo 'A token-shaped Tailscale literal is committed; use synthetic fixtures assembled from parts.' >&2
            exit 1
          fi
      - name: Unit and local integration tests
        run: go test ./src/...
      - name: Archived experiment checks
        run: go test ./experiments/...
      - name: Vet
        run: go vet ./src/...
      - name: Dashboard model
        run: node --test src/internal/dashboard/web/model.test.mjs
      - name: Build production CLI
        run: go build ./src/cmd/herdr-mesh
      - name: Release build policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 `
            -Version ci `
            -Targets windows-arm64 `
            -OutputDirectory "$env:RUNNER_TEMP\herdr-mesh-release"
      - name: Windows bootstrap automation boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\test-bootstrap-node.ps1
      - name: Race checks
        if: runner.os == 'Linux'
        run: go test -race ./src/internal/...
